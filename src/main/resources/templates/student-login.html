<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login</title><link rel="stylesheet" href="/style.css"></head>
<body><main><section class="panel narrow">
<h1>Student Login</h1><p>Log in to mark your attendance using live device location.</p>
<p class="message" th:if="${error}" th:text="${error}"></p>
<form action="/student/login" method="post">
<label>Student ID</label><input name="studentId" placeholder="STU001" required>
<label>Password</label><input type="password" name="password" placeholder="student123" required>
<button type="submit">Login</button>
</form>
<p><strong>Demo account:</strong> STU001 / student123</p>
<a href="/">Back to dashboard</a>
</section></main></body></html>
