<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><h1>Student Management</h1><p>Admin only</p></div><nav><a class="button" href="/manage">Manage attendance</a><a class="button" href="/logout">Logout</a></nav></header>
<main><section class="panel"><h2>Add student</h2><p>New students use <strong>student123</strong> if no password is supplied.</p><form action="/admin/students" method="post"><input name="studentId" placeholder="Student ID" required><input name="name" placeholder="Name" required><input name="department" placeholder="Department" required><input name="section" placeholder="Section" required><input name="year" placeholder="Year" required><input name="whatsappId" placeholder="Optional WhatsApp ID"><input name="password" placeholder="Student password"><button type="submit">Add student</button></form></section>
<section class="panel"><h2>Registered students</h2><table><tr><th>ID</th><th>Name</th><th>Department</th><th>Section</th><th>Year</th></tr><tr th:each="s:${students}"><td th:text="${s.studentId}"></td><td th:text="${s.name}"></td><td th:text="${s.department}"></td><td th:text="${s.section}"></td><td th:text="${s.year}"></td></tr></table></section></main></body></html>
